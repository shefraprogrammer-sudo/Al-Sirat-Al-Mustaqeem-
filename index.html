<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d26">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>الصراط المستقيم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1d26;--bg2:#10283a;--card:rgba(255,255,255,.05);--txt:#e6efe9;--mut:#9db3b0;--cy:#5eead4;--pk:#f0abfc;--gd:#fde68a;--gr:#86efac;--btnbg:rgba(21,46,58,.78);--btnon:rgba(23,64,63,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:'Cairo',system-ui,sans-serif;color:var(--txt);background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg1) 70%);background-color:var(--bg1);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
@keyframes mv{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
.float .row{position:absolute;left:0;white-space:nowrap;font-family:Amiri,serif;font-weight:700;line-height:1.6;background:linear-gradient(90deg,#fde68a,#f0abfc,#5eead4,#fde68a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:.4;filter:drop-shadow(0 0 10px rgba(94,234,212,.7));animation:mv linear infinite;will-change:transform}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-35px) rotate(12deg)}}
header,main,footer{position:relative;z-index:1;width:100%;max-width:900px;margin:0 auto;padding:0 14px}
header{text-align:center;padding-top:64px}
h1{margin:0;font-size:clamp(1.9rem,6vw,3rem);font-weight:900;color:var(--cy);text-shadow:0 0 10px var(--cy),0 0 28px rgba(94,234,212,.5)}
.sub{color:var(--gd);font-family:Amiri,serif;font-size:1.2rem;text-shadow:0 0 10px rgba(253,230,138,.5)}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
nav button{font:inherit;font-weight:700;color:var(--txt);background:var(--btnbg);border:1px solid rgba(94,234,212,.3);border-radius:16px;padding:12px 6px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .ic{font-size:1.8rem;filter:drop-shadow(0 0 6px var(--pk))}
nav button:hover,nav button.on{border-color:var(--cy);box-shadow:0 0 14px rgba(94,234,212,.45);background:var(--btnon)}
nav button.on{color:var(--cy)}
section{display:none;animation:in .5s}section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:1px solid rgba(240,171,252,.25);border-radius:18px;padding:16px;margin-bottom:12px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip,.btn{font:inherit;color:var(--txt);background:rgba(240,171,252,.1);border:1px solid var(--pk);border-radius:50px;padding:10px 18px;cursor:pointer;transition:.2s}
.chip:hover,.btn:hover{box-shadow:0 0 14px var(--pk)}
.btn.main{border-color:var(--cy);background:rgba(94,234,212,.15);font-weight:700}
.btn.main:hover{box-shadow:0 0 14px var(--cy)}
.c{text-align:center}h2{margin:.2em 0 .6em;color:var(--gd);font-size:1.3rem;text-shadow:0 0 8px rgba(253,230,138,.4)}
input,select{font:inherit;color:var(--txt);background:rgba(0,0,0,.3);border:1px solid var(--cy);border-radius:12px;padding:10px;text-align:center;max-width:100%}
select option{background:#10283a}
.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:10px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--cy);stroke-linecap:round;transition:stroke-dashoffset .25s;filter:drop-shadow(0 0 6px var(--cy))}
.tap{position:absolute;inset:14%;border-radius:50%;border:none;cursor:pointer;font:inherit;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:900;color:var(--gd);background:radial-gradient(circle,rgba(94,234,212,.2),rgba(94,234,212,.04));text-shadow:0 0 14px var(--gd);touch-action:manipulation}
.tap:active{transform:scale(.94)}
.zk{font-family:Amiri,serif;font-size:1.35rem;line-height:2;margin:0 0 8px}
.zk-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cnt{font-family:inherit;min-width:74px;font-weight:700;color:var(--cy);background:rgba(94,234,212,.12);border:1px solid var(--cy);border-radius:50px;padding:8px 14px;cursor:pointer}
.done{opacity:.45;border-color:var(--gr)}.done .cnt{color:var(--gr);border-color:var(--gr)}
#ayat{font-family:Amiri,serif;line-height:2.3;text-align:justify;font-size:1.6rem}
#ayat b{color:var(--gd);font-size:.9em;margin:0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.mut{color:var(--mut)}
.shefra{font-weight:900;letter-spacing:2px;color:#fff;text-decoration:none;cursor:pointer;animation:neon 2s ease-in-out infinite alternate;display:inline-block}
@keyframes neon{from{text-shadow:0 0 4px #fff,0 0 10px #f0abfc,0 0 20px #f0abfc,0 0 35px #c026d3;color:#fdf4ff}to{text-shadow:0 0 6px #fff,0 0 16px #5eead4,0 0 32px #5eead4,0 0 55px #14b8a6;color:#f0fdfa}}
footer{margin-top:auto;text-align:center;padding:22px 14px;color:var(--mut);font-size:.95rem}
footer .shefra{font-size:1.15rem}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:50;background:rgba(16,40,58,.95);border:1px solid var(--gd);color:var(--gd);padding:12px 20px;border-radius:50px;font-family:Amiri,serif;font-size:1.25rem;box-shadow:0 0 22px rgba(253,230,138,.4);transition:transform .6s,opacity .6s;opacity:0;text-align:center;max-width:92vw}
#toast.show{transform:translate(-50%,0);opacity:1}
#about{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:radial-gradient(circle,#10283a,#07131a);overflow:auto}
#about.on{display:flex;animation:in .6s}
#about h1{font-size:clamp(2.2rem,9vw,4rem)}
#about .sal{font-family:Amiri,serif;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gd);margin:18px 0;text-shadow:0 0 14px var(--gd)}
#about .shefra{font-size:clamp(2rem,8vw,3.2rem);margin:6px 0 26px}
@media(max-width:480px){.zk{font-size:1.2rem}#ayat{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#topBtns{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:30;display:flex;gap:8px}
#aboutBtn,#setBtn{font:inherit;font-weight:900;font-size:1rem;color:#fff;background:rgba(16,40,58,.78);border:2px solid var(--pk);border-radius:50px;padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;animation:glow 2s ease-in-out infinite alternate;touch-action:manipulation}
#aboutBtn:active,#setBtn:active{transform:scale(.95)}
@keyframes glow{from{box-shadow:0 0 6px var(--pk),0 0 14px rgba(240,171,252,.5);border-color:var(--pk)}to{box-shadow:0 0 12px var(--cy),0 0 28px rgba(94,234,212,.7),inset 0 0 8px rgba(94,234,212,.3);border-color:var(--cy)}}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;margin:7px 0;background:var(--card);border:1px solid transparent;font-weight:700;transition:.3s}
.pr-row.nx{border-color:var(--cy);color:var(--cy);box-shadow:0 0 16px rgba(94,234,212,.5);background:rgba(94,234,212,.1)}
.pr-row span:last-child{direction:rtl;font-size:1.1rem}
.cd{font-size:clamp(1.9rem,8vw,2.8rem);font-weight:900;color:var(--gd);text-shadow:0 0 12px var(--gd);direction:ltr;letter-spacing:2px}
body.light{--bg1:#f3efe4;--bg2:#e3efe9;--card:rgba(0,0,0,.05);--txt:#1e2b2a;--mut:#4b5f5c;--cy:#0f766e;--pk:#a21caf;--gd:#92400e;--gr:#15803d;--btnbg:rgba(235,232,220,.78);--btnon:rgba(207,232,227,.78)}
body.light #toast,body.light #aboutBtn,body.light #setBtn{background:#fff;color:#1e2b2a}body.light #about{background:#f3efe4}
.ay{cursor:pointer;border-radius:6px}.ay:hover{background:rgba(94,234,212,.15)}.ay.sel{background:rgba(240,171,252,.2);box-shadow:0 0 0 2px rgba(240,171,252,.5);border-radius:8px}.ay.pl{background:rgba(94,234,212,.22);box-shadow:0 0 0 2px rgba(94,234,212,.55),0 0 18px rgba(94,234,212,.35);color:var(--gd);transition:.3s}.ay.hl{background:rgba(253,230,138,.22)}.ay.bk{color:var(--gd);text-shadow:0 0 8px var(--gd)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(128,128,128,.2)}
.qib{width:min(240px,70vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--cy);box-shadow:0 0 18px rgba(94,234,212,.4);margin:14px auto;position:relative}
.qib b{position:absolute;inset:0;display:flex;justify-content:center;font-size:2.4rem;transition:transform .2s}
.pg{height:5px;border-radius:5px;background:rgba(128,128,128,.25);margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--cy);box-shadow:0 0 8px var(--cy);transition:width .15s}
.card[onclick]{cursor:pointer;-webkit-user-select:none;user-select:none}.card[onclick]:active{transform:scale(.99)}
#ayat{overflow:hidden}.mpg{min-height:40vh;padding:4px}
@keyframes foN{to{opacity:0;transform:perspective(900px) translateX(70px) rotateY(28deg)}}
@keyframes foP{to{opacity:0;transform:perspective(900px) translateX(-70px) rotateY(-28deg)}}
@keyframes flN{from{opacity:0;transform:perspective(900px) translateX(-70px) rotateY(-28deg)}to{opacity:1;transform:none}}
@keyframes flP{from{opacity:0;transform:perspective(900px) translateX(70px) rotateY(28deg)}to{opacity:1;transform:none}}
body.qmode header,body.qmode footer,body.qmode #topBtns,body.qmode #daily,body.qmode .float{display:none!important}
body.qmode main{padding-top:58px}
#qback{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:30;font:inherit;font-weight:900;font-size:1.05rem;color:var(--txt);background:rgba(16,40,58,.92);border:2px solid var(--cy);border-radius:50px;padding:8px 18px;cursor:pointer;align-items:center;gap:6px;touch-action:manipulation}
body.light #qback{background:#fff}
body.qmode #qback{display:flex}
#quran.on{display:flex;flex-direction:column}#wird{order:2}
nav{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0 14px}
nav button{padding:7px 4px;font-size:.8rem;border-radius:14px;gap:1px}
nav button .ic{font-size:1.3rem}
@media(max-width:560px){nav{grid-template-columns:repeat(3,1fr)}h1{font-size:clamp(1.6rem,7vw,2.2rem)}header{padding-top:58px}}
main{display:flex;flex-direction:column}#daily{order:5}section{scroll-margin-top:8px}
</style>
</head>
<body>
<div class="float" id="fl"></div>
<div id="toast"></div>
<button id="qback" onclick="if(history.state&&history.state.q)history.back();else qclose()">→ رجوع</button>
<div id="topBtns"><button id="aboutBtn" onclick="document.getElementById('about').classList.add('on')">💫 حول</button><button id="setBtn" onclick="show('settings')">⚙️ الإعدادات</button></div>

<header>
  <h1>الصِّرَاطُ الْمُسْتَقِيمُ</h1>
  <div class="sub">ألا بذكر الله تطمئن القلوب</div>
  <nav id="nav"></nav>
</header>

<main>
  <div class="card c" id="daily"></div>
  <section id="tasbih"></section>
  <section id="quran">
    <div class="card c" id="wird"></div>
    <div class="card">
      <div class="bar">
        <input id="sq" type="search" placeholder="🔍 سورة أو آية أو 2:255" autocomplete="off" style="flex:1;min-width:200px" oninput="sf()" onkeydown="event.key=='Enter'&&(sf(),vs())">
        <button class="btn main" onclick="sf();vs()">بحث</button>
      </div>
      <div id="sres" class="chips" style="margin-bottom:12px"></div><div id="vres"></div>
      <div class="bar">
        <select id="surah"><option>جاري التحميل…</option></select>
        <button class="btn" onclick="fs(2)">A+</button><button class="btn" onclick="fs(-2)">A−</button>
      </div>
      <div class="bar"><select id="rec"><option value="ar.alafasy">مشاري العفاسي</option><option value="ar.husary">محمود الحصري</option><option value="ar.minshawi">المنشاوي</option><option value="ar.abdulbasitmurattal">عبد الباسط</option></select></div><div class="bar"><button class="btn" id="rpt">🔁 تكرار الآية</button><select id="rpn"><option value="0">بلا حد ∞</option><option value="3">3 مرات</option><option value="5">5 مرات</option><option value="10">10 مرات</option></select></div><audio id="au" controls style="width:100%;margin-bottom:12px"></audio><div id="bks" class="chips" style="margin-bottom:12px"></div><div id="ap"></div><div id="ayat" class="mut c">اختر سورة للقراءة</div>
      <div id="pgn" class="bar" style="margin-top:14px;justify-content:space-between;align-items:center"></div>
    </div>
  </section>
  <section id="prayer"></section>
  <section id="morning"></section>
  <section id="evening"></section>
  <section id="after"></section>
  <section id="other"></section>
  <section id="qibla"></section><section id="names"></section><section id="settings"></section>
</main>

<footer>
  كل الحقوق محفوظة © <span id="yr"></span> — تم تطوير الموقع بواسطة <a class="shefra" data-wa target="_blank" rel="noopener">SHEFRA</a>
</footer>

<div id="about">
  <h1>الصِّرَاطُ الْمُسْتَقِيمُ</h1>
  <div class="sal">صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ ﷺ</div>
  <div class="mut">تم تطوير الموقع بواسطة</div>
  <a class="shefra" data-wa target="_blank" rel="noopener">SHEFRA</a>
  <button class="btn main" onclick="about.classList.remove('on')">رجوع للموقع</button>
</div>

<script>
const $=s=>document.querySelector(s);
const WA='https://wa.me/201091462051?text='+encodeURIComponent('السلام عليكم ورحمة الله وبركاته 🌙\nزرت موقع (الصراط المستقيم) وأعجبني جداً، وحابب أتواصل معك.');
document.querySelectorAll('[data-wa]').forEach(a=>a.href=WA);
$('#yr').textContent=new Date().getFullYear();

// أيقونات عائمة
const kal='لَا إِلَٰهَ إِلَّا ٱللَّهُ مُحَمَّدٌ رَسُولُ ٱللَّهِ';
const r=document.createElement('div');r.className='row';r.textContent=kal;
r.style.cssText='top:40%;font-size:clamp(34px,7vw,90px);animation-duration:22s';$('#fl').appendChild(r);

// التنقل
const tabs=[['tasbih','📿','السبحة'],['quran','📖','المصحف'],['prayer','🕋','مواقيت الصلاة'],['qibla','🧭','القبلة'],['morning','🌅','أذكار الصباح'],['evening','🌙','أذكار المساء'],['after','🕌','بعد الصلاة'],['other','🤲','أذكار أخرى'],['names','💎','أسماء الله']];
tabs.forEach(([id,ic,t])=>{const b=document.createElement('button');b.id='b_'+id;b.innerHTML=`<span class="ic">${ic}</span><span class="t">${t}</span>`;
 b.onclick=()=>id=='about'?about.classList.add('on'):show(id);$('#nav').appendChild(b)});
function show(id){qopen(id)}
const about=$('#about');

// تنبيه الصلاة على النبي كل 30 ثانية
function toast(t,ms=4500){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),ms)}
const lg=(k,d)=>{try{const v=localStorage.getItem('s_'+k);return v?JSON.parse(v):d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem('s_'+k,JSON.stringify(v))}catch(e){}};
const ST=Object.assign({sal:30,snd:1,vib:1,adhan:0,adsnd:0,light:0,en:0},lg('st',{}));
let AC;function beep(f=660,d=.25,n=1){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.5;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}}catch(e){}}
const tick=()=>beep(520,.08);
let st;function sched(){clearInterval(st);if(ST.sal>0)st=setInterval(()=>{toast('اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ ﷺ');ST.snd&&beep(700,.5)},ST.sal*1000)}
sched();
const EN={tasbih:'Tasbih',quran:'Quran',prayer:'Prayer Times',qibla:'Qibla',morning:'Morning Adhkar',evening:'Evening Adhkar',after:'After Prayer',other:'Duas',names:'99 Names',settings:'Settings'};
function ap(){document.body.classList.toggle('light',!!ST.light);document.documentElement.dir=ST.en?'ltr':'rtl';tabs.forEach(([id,,t])=>{const e=document.querySelector('#b_'+id+' .t');e&&(e.textContent=ST.en?EN[id]:t)});document.querySelector('.sub').textContent=ST.en?'Verily, in the remembrance of Allah do hearts find rest':'ألا بذكر الله تطمئن القلوب';$('#aboutBtn').lastChild.textContent=ST.en?' About':' حول';$('#setBtn').lastChild.textContent=ST.en?' Settings':' الإعدادات'}
ap();

// السبحة
const adh=['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','أستغفر الله','سبحان الله وبحمده','سبحان الله العظيم','اللهم صل وسلم على نبينا محمد','لا حول ولا قوة إلا بالله','حسبي الله ونعم الوكيل'];
let remain=[...adh],cur=null,target=0,n=0;
function tsChoose(){cur=null;sv('ts',{remain});const T=$('#tasbih');
 if(!remain.length){T.innerHTML=`<div class="card c"><h2>ما شاء الله، أتممت كل الأذكار 🌟</h2><p class="mut">تقبل الله منك</p><button class="btn main" onclick="remain=[...adh];tsChoose()">ابدأ من جديد</button></div>`;return}
 T.innerHTML=`<div class="card c"><h2>اختر الذكر</h2><div class="chips">${remain.map((a,i)=>`<button class="chip" onclick="tsPick(${i})">${a}</button>`).join('')}</div></div>`+stH()}
function tsPick(i){cur=remain[i];$('#tasbih').innerHTML=`<div class="card c"><h2>${cur}</h2><p class="mut">كم مرة تريد أن تقولها؟</p>
 <div class="chips" style="margin-bottom:12px">${[3,10,33,100].map(x=>`<button class="chip" onclick="tsStart(${x})">${x}</button>`).join('')}</div>
 <input id="num" type="number" min="1" inputmode="numeric" placeholder="عدد آخر">
 <button class="btn main" onclick="tsStart(+$('#num').value)">ابدأ</button>
 <p><button class="btn" onclick="tsChoose()">رجوع</button></p></div>`}
function tsStart(x){if(!x||x<1)return toast('اكتب عدداً صحيحاً',2000);target=Math.floor(x);n=0;tsDraw()}
function tsDraw(){const C=2*Math.PI*45;$('#tasbih').innerHTML=`<div class="card c"><h2>${cur}</h2>
 <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="fg" cx="50" cy="50" r="45" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
 <button class="tap" id="tap">0</button></div>
 <p class="mut">الهدف: ${target}</p><button class="btn" onclick="n=0;tsUpd()">تصفير</button> <button class="btn" onclick="tsChoose()">تغيير الذكر</button></div>`+stH();
 $('#tap').onclick=()=>{n++;ST.vib&&navigator.vibrate&&navigator.vibrate(15);ST.snd&&tick();stat();tsUpd();if(n>=target){navigator.vibrate&&navigator.vibrate([80,60,80]);toast('تقبل الله منك 🤍',2500);
  remain=remain.filter(a=>a!=cur);setTimeout(tsChoose,700)}}}
function tsUpd(){sv('ts',{remain,cur,target,n});const C=2*Math.PI*45;$('#tap').textContent=n;$('#fg').style.strokeDashoffset=C*(1-Math.min(n/target,1))}
{const o=lg('ts',null);if(o&&o.remain){remain=o.remain.filter(a=>adh.includes(a));if(o.cur&&o.target){cur=o.cur;target=o.target;n=o.n||0;tsDraw();tsUpd()}else tsChoose()}else tsChoose()}
